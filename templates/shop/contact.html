
{% extends 'base.html' %}
{% block main %}
		<main class="main">
			<nav aria-label="breadcrumb" class="breadcrumb-nav">
				<div class="container">
					<ol class="breadcrumb">
						<li class="breadcrumb-item">
							<a href="demo4.html"><i class="icon-home"></i></a>
						</li>
						<li class="breadcrumb-item active" aria-current="page">
							Contact Us
						</li>
					</ol>
				</div>
			</nav>
			<div class="container contact-us-container">
				<div class="row">
					<div class="col-lg-12">
						<h2 class="mt-6 mb-2">Envoie-nous un message</h2>

						<form class="mb-0" action="{% url 'myshop:contact_us' %}" method="post">
							{% csrf_token %}
                            <div class="form-group">
								<label class="mb-1" for="contact-name">Nom
									<span class="required">*</span></label>
                                    {{ form.name }}
							</div>

							<div class="form-group">
								<label class="mb-1" for="contact-email">E-mail
									<span class="required">*</span></label>
                                    {{ form.email }}
							</div>

							<div class="form-group">
								<label class="mb-1" for="contact-message">Message
									<span class="required">*</span></label>
                                    {{ form.message }}
							</div>

							<div class="form-footer mb-0">
								<button type="submit" class="btn btn-dark font-weight-normal">
									Envoyer votre Message
								</button>
							</div>
						</form>
					</div>
                </div>
			</div>

			<div class="mb-8"></div>
		</main>

{% endblock %}
